<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Beat KP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b1630;--card:#13224a;--accent:#d7ff3a;--red:#ff4757;--txt:#eef2ff;--mut:#9aa7c7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:440px;margin:0 auto;padding:14px 12px 28px}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:56px;line-height:.9;margin:4px 0 2px;letter-spacing:1px;text-align:center}
  h1 span{color:var(--accent)}
  .sub{text-align:center;color:var(--mut);font-size:14px;margin-bottom:12px}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .stat{background:var(--card);border-radius:12px;padding:8px 6px;text-align:center}
  .stat b{display:block;font-family:'Bebas Neue',Impact,sans-serif;font-size:32px;line-height:1}
  .stat small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .stat.kp b{color:var(--accent)}
  canvas{width:100%;display:block;border-radius:14px;touch-action:none;cursor:crosshair}
  .types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .types button,.share{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 6px;background:var(--card);color:var(--txt);font-size:14px}
  .types button.on{background:var(--accent);color:#0b1630}
  .msg{min-height:48px;text-align:center;font-weight:600;font-size:15px;padding:6px 4px}
  .share{width:100%;background:transparent;border:2px solid var(--card);color:var(--mut)}
  .total{text-align:center;color:var(--mut);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>BEAT <span>KP</span></h1>
  <div class="sub">Niklas Landin mod KP fra 7 meter. Tryk i målet for at skyde.</div>
  <div class="board">
    <div class="stat"><b id="goals">0</b><small>Dine mål</small></div>
    <div class="stat"><b id="shots">0</b><small>Skud</small></div>
    <div class="stat kp"><b id="pct">–</b><small>KP redning%</small></div>
  </div>
  <canvas id="c"></canvas>
  <div class="types" id="types">
    <button data-t="hard" class="on">💥 Hårdt</button>
    <button data-t="lob">🎈 Lob</button>
    <button data-t="spin">🌀 Skru</button>
  </div>
  <div class="msg" id="msg">Vælg skudtype og tryk der, hvor du vil placere bolden.</div>
  <button class="share" id="share">Del dit resultat</button>
  <div class="total" id="total"></div>
</div>

window.addEventListener('resize',resize);resize();

const BANNERS=["REDDET!","KP!!!","MUREN","NEJ NEJ NEJ","INGEN ADGANG"];

function toVirtual(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  if(mode!=='idle')return;
  const p=toVirtual(e);if(p.y>400)return;
  let wide=p.x<G.l+8||p.x>G.r-8||p.y<G.t+8||p.y>G.b-6;
  const tx=Math.min(G.r-16,Math.max(G.l+16,p.x)),ty=Math.min(G.b-14,Math.max(G.t+14,p.y));
  let style='hand';
  if(ty>258&&Math.abs(tx-200)>40)style='foot';else if(ty<240&&ty>150&&Math.abs(tx-200)<90&&Math.random()<.35)style='face';
  const dur={hard:380,lob:720,spin:560}[type];
  shot={tx,ty,type,style,wide,start:performance.now(),dur,dir:Math.random()<.5?-1:1,
    defl:{vx:(tx<200?-1:1)*(1.5+Math.random()*2),vy:2+Math.random()*2}};
  mode='shooting';
});

const ease=t=>1-Math.pow(1-t,3);
function keeperSize(){return 1+Math.min(shots,30)*0.012;}
function rot(x,y,a){return{x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)}}

function court(){
  ctx.fillStyle='#1d4f91';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#e07b39';ctx.beginPath();ctx.ellipse(200,G.b,250,150,0,0,Math.PI);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,G.b);ctx.lineTo(W,G.b);ctx.stroke();
  ctx.beginPath();ctx.ellipse(200,G.b,250,150,0,0,Math.PI);ctx.stroke();
  ctx.setLineDash([12,10]);ctx.beginPath();ctx.ellipse(200,G.b,330,215,0,0.1,Math.PI-0.1);ctx.stroke();ctx.setLineDash([]);
  ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(185,488);ctx.lineTo(215,488);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='700 12px Inter';ctx.textAlign='center';
  // net
  ctx.fillStyle='#0a1a33';ctx.fillRect(G.l,G.t,G.r-G.l,G.b-G.t);
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
  for(let x=G.l;x<=G.r;x+=15){ctx.beginPath();ctx.moveTo(x,G.t);ctx.lineTo(x,G.b);ctx.stroke();}
  for(let y=G.t;y<=G.b;y+=15){ctx.beginPath();ctx.moveTo(G.l,y);ctx.lineTo(G.r,y);ctx.stroke();}
  // posts red/white
  const seg=20;
  for(let i=0;i<(G.b-G.t)/seg;i++){ctx.fillStyle=i%2?'#fff':'#e63946';ctx.fillRect(G.l-10,G.t+i*seg,10,seg);ctx.fillRect(G.r,G.t+i*seg,10,seg);}
  for(let i=0;i<(G.r-G.l+20)/seg;i++){ctx.fillStyle=i%2?'#fff':'#e63946';ctx.fillRect(G.l-10+i*seg,G.t-10,seg,10);}
}

function limb(a,b,w){ctx.lineWidth=w;ctx.lineCap='round';ctx.strokeStyle='#f1c27d';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}

function keeper(now,p,s){
  const sz=keeperSize(),sway=Math.sin(now/260)*7*(p<0.01?1:1-p);
  let hip0={x:200+sway,y:262},hipT=hip0,angT=0,tgt=null,style=s?s.style:'hand';
  if(s){tgt={x:s.tx,y:s.ty};
    if(style==='hand'){hipT={x:200+(s.tx-200)*.55,y:262+(s.ty-220)*.3};angT=Math.max(-1.1,Math.min(1.1,(s.tx-200)/150*.85));}
    if(style==='foot'){hipT={x:200+(s.tx-200)*.4,y:258};angT=-(s.tx-200)/150*.35;}
    if(style==='face'){hipT={x:s.tx,y:s.ty+64*sz};angT=0;}
  }
  const e=ease(p),hip={x:hip0.x+(hipT.x-hip0.x)*e,y:hip0.y+(hipT.y-hip0.y)*e},ang=angT*e;
  const W2=(rx,ry)=>{const r=rot(rx*sz,ry*sz,ang);return{x:hip.x+r.x,y:hip.y+r.y}};
  const side=s&&s.tx<200?-1:1;
  // legs
  const lf={x:-12,y:48},rf={x:12,y:48};
  if(style==='foot'&&tgt){
    const footSide=side===-1?'l':'r';
    const other=footSide==='l'?rf:lf, hipPt=W2(footSide==='l'?-8:8,0);
    limb(W2(other.x<0?-8:8,0),W2(other.x,other.y),10*sz);
    const rest=W2(footSide==='l'?-12:12,48);
    limb(hipPt,{x:rest.x+(tgt.x-rest.x)*e,y:rest.y+(tgt.y-rest.y)*e},10*sz);
  }else{limb(W2(-8,0),W2(-12,48),10*sz);limb(W2(8,0),W2(12,48),10*sz);}
  // arms (behind torso for the non-active arm)
  const shL=W2(-16,-44),shR=W2(16,-44);
  let handL=W2(-34,-62),handR=W2(34,-62);
  if(style==='hand'&&tgt){const sh=side===-1?shL:shR,rest=side===-1?handL:handR;const h={x:rest.x+(tgt.x-rest.x)*e,y:rest.y+(tgt.y-rest.y)*e};if(side===-1)handL=h;else handR=h;}
  limb(shL,handL,9*sz);limb(shR,handR,9*sz);
  // gloves
  [handL,handR].forEach(h=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x,h.y,6*sz,0,7);ctx.fill();});
  // torso + head
  ctx.save();ctx.translate(hip.x,hip.y);ctx.rotate(ang);ctx.scale(sz,sz);
  ctx.fillStyle='#d7ff3a';ctx.beginPath();ctx.roundRect(-18,-52,36,54,8);ctx.fill();
  ctx.fillStyle='#0b1630';ctx.font='900 17px Inter';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('KP',0,-26);
  if(kpOk){ctx.save();ctx.beginPath();ctx.arc(0,-74,24,0,7);ctx.clip();ctx.drawImage(kpImg,-24,-98,48,48);ctx.restore();
    ctx.strokeStyle='#d7ff3a';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-74,24,0,7);ctx.stroke();}
  else{ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-74,24,0,7);ctx.fill();}
  ctx.restore();
}

function ballAt(s,u){
  const sx=HAND0.x,sy=HAND0.y,x=sx+(s.tx-sx)*u,y=sy+(s.ty-sy)*u;
  let ox=0,oy=0;
  if(s.type==='lob')oy=-Math.sin(Math.PI*u)*150;
  if(s.type==='spin')ox=Math.sin(Math.PI*u)*70*s.dir;
  return{x:x+ox,y:y+oy-10*(1-u),r:14-5*u};
}
function drawBall(b,alpha=1){
  ctx.globalAlpha=alpha;ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  ctx.strokeStyle='#c1440e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.moveTo(b.x-b.r,b.y);ctx.quadraticCurveTo(b.x,b.y-b.r*.6,b.x+b.r,b.y);ctx.stroke();
  ctx.globalAlpha=1;
}

function finishShot(){
  shots++;total++;try{localStorage.setItem('beatkp_total',total)}catch(e){}
  document.getElementById('shots').textContent=shots;
  document.getElementById('pct').textContent='100%';
  document.getElementById('total').textContent=`Samlet på denne enhed: 0 mål på ${total} skud mod KP`;
  let m=ESC[shots]||(shot.wide?pick(MSG.wide):(shot.type!=='hard'&&Math.random()<.5?pick(MSG[shot.type]):pick(Math.random()<.3?MSG.landin:MSG[shot.style])));
  document.getElementById('msg').textContent=m;
  banner={text:pick(BANNERS),start:performance.now()};
  if(navigator.vibrate)try{navigator.vibrate(40)}catch(e){}
}

const HAND0={x:236,y:420};
function shooter(now){
  const cx=200,bob=Math.sin(now/300)*2;let hand={x:HAND0.x,y:HAND0.y+bob};
  if(shot){const t=(now-shot.start)/shot.dur;
    if(t<.35){const k=t/.35;hand={x:236-10*k,y:420-22*k};}
    else{const k=Math.min(1,(t-.35)/.5);hand={x:226-40*k,y:398+60*k};}}
  const hip={x:cx,y:510},sh={x:cx,y:462};
  limb({x:cx-9,y:hip.y},{x:cx-20,y:556},12);limb({x:cx+9,y:hip.y},{x:cx+18,y:556},12);
  ctx.fillStyle='#fff';ctx.fillRect(cx-22,500,44,16); // shorts
  limb({x:cx-20,y:sh.y},{x:cx-36,y:500},10);
  ctx.fillStyle='#c8102e';ctx.beginPath();ctx.roundRect(cx-24,456,48,52,10);ctx.fill();
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 9px Inter';ctx.fillText('NIKLAS',cx,470);ctx.font='900 12px Inter';ctx.fillText('LANDIN',cx,484);
  limb({x:cx+20,y:sh.y},hand,10);
  // head
  const hx=cx,hy=432,r=22;
  // set bagfra: nakke + hår, ingen ansigt
  ctx.fillStyle='#f1c27d';ctx.beginPath();ctx.arc(hx-r+1,hy+2,4,0,7);ctx.arc(hx+r-1,hy+2,4,0,7);ctx.fill(); // ører
  ctx.fillStyle='#f1c27d';ctx.fillRect(hx-8,hy+12,16,14); // nakke
  ctx.fillStyle='#5a3d22';ctx.beginPath();ctx.arc(hx,hy,r,0,7);ctx.fill();
  ctx.fillStyle='#6f4c2b';ctx.beginPath();ctx.arc(hx-5,hy-6,r*.6,0,7);ctx.fill();
  return hand;
}
function loop(now){
  ctx.setTransform(scale,0,0,scale,0,0);
  court();
  if(mode==='idle'){keeper(now,0,null);const h=shooter(now);drawBall({x:h.x,y:h.y-10,r:14});}
  else{
    const el=now-shot.start,u=Math.min(1,el/shot.dur);
    keeper(now,Math.min(1,u*1.18),shot);shooter(now);
    if(u<1)drawBall(ballAt(shot,u));
    else{
      if(!shot.done){shot.done=true;finishShot();}
      const t=(el-shot.dur)/16,b={x:shot.tx+shot.defl.vx*t*2,y:shot.ty+shot.defl.vy*t*2+0.05*t*t,r:9};
      drawBall(b,Math.max(0,1-t/50));
      if(el>shot.dur+950){mode='idle';shot=null;}
    }
  }
  if(banner){const a=(now-banner.start)/900;
    if(a<1){ctx.save();ctx.globalAlpha=1-a*a;ctx.translate(200,410);ctx.scale(1+a*.3,1+a*.3);ctx.rotate(-.06);
      ctx.font='64px "Bebas Neue",Impact';ctx.textAlign='center';ctx.textBaseline='middle';
      const fw=ctx.measureText(banner.text).width;if(fw>320){const k=320/fw;ctx.scale(k,k);}ctx.lineWidth=8;ctx.strokeStyle='#0b1630';ctx.strokeText(banner.text,0,0);ctx.fillStyle='#d7ff3a';ctx.fillText(banner.text,0,0);ctx.restore();}
    else banner=null;}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if(total)document.getElementById('total').textContent=`Samlet på denne enhed: 0 mål på ${total} skud mod KP`;

document.getElementById('share').onclick=async function(){
  const t=shots?`Jeg tog ${shots} straffekast som Niklas Landin mod KP og scorede 0 mål. Han er en mur 🧱 Kan du gøre det bedre? #BeatKP`:`Kan du score på KP fra 7 meter? #BeatKP`;
  try{await navigator.clipboard.writeText(t);this.textContent='Kopieret – indsæt hvor du vil ✓';}catch(e){this.textContent=t;}
  setTimeout(()=>this.textContent='Del dit resultat',2500);
};
</script>
